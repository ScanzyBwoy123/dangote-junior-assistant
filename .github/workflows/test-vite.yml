name: Test Dangote Junior Assistant

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        working-directory: dangote-junior-assistant
        run: pnpm install --no-frozen-lockfile --ignore-workspace

      - name: Verify React installation
        working-directory: dangote-junior-assistant
        run: node -e "console.log(require.resolve('react/jsx-runtime'))"

      - name: Build Dangote Junior Assistant
        working-directory: dangote-junior-assistant
        run: pnpm run build
